services:
  - type: web
    name: cfd3-dual-engine
    env: docker
    plan: starter   # まずは Starter/Standard を推奨（Free はスリープで遅い）
    envVars:
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: PPLX_API_KEY
        sync: false
services:
  - type: web
    name: cfd3-dual-engine
    env: docker
    plan: starter
    region: oregon
    envVars:
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: PPLX_API_KEY
        sync: false
